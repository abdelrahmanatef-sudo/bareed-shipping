<style>
/* Layout: dark sidebar (bottom tab bar on phones) + sticky top bar + content. Brand: deep green-black, teal actions, amber mark. */
:root {
  --bg: #F4F6F6;
  --surface: #FFFFFF;
  --surface-2: #EEF3FA;
  --ink: #0E1A2B;
  --muted: #5B6967;
  --line: #E1E7E6;
  --brand: #0A6FC4;
  --brand-soft: #DCEEFB;
  --on-brand: #FFFFFF;
  --accent: #F5B700;
  --logo-fg: #FFFFFF;
  --side-bg: #0C2038;
  --side-ink: #E6F0FB;
  --side-muted: #8DA8C6;
  --side-hover: rgba(255, 255, 255, .07);
  --side-active: rgba(245, 183, 0, .16);
  --s-new: #2F63C9;      --s-new-bg: #E3EBFA;
  --s-picked: #7140C8;   --s-picked-bg: #EBE3FA;
  --s-out: #A86400;      --s-out-bg: #FCEBCB;
  --s-delivered: #17784A; --s-delivered-bg: #DCF2E5;
  --s-returned: #B4332E; --s-returned-bg: #FADEDC;
  --shadow: 0 1px 2px rgba(14,26,43, .05), 0 4px 14px rgba(14,26,43, .04);
  --font-display: "Alexandria", "Rubik", system-ui, sans-serif;
  --font-body: "Rubik", "Alexandria", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09121F; --surface: #111E30; --surface-2: #162A40; --ink: #E6F0FB; --muted: #94AAC4; --line: #22344B;
    --brand: #2AA9F0; --brand-soft: #12355A; --on-brand: #05203A; --side-bg: #060F1B; --side-active: rgba(245, 183, 0, .14);
    --s-new: #8EB1F2; --s-new-bg: #182847; --s-picked: #B79BF0; --s-picked-bg: #2A2047;
    --s-out: #F2B558; --s-out-bg: #3A2A10; --s-delivered: #5FD494; --s-delivered-bg: #123422;
    --s-returned: #F08A85; --s-returned-bg: #3F1B19; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09121F; --surface: #111E30; --surface-2: #162A40; --ink: #E6F0FB; --muted: #94AAC4; --line: #22344B;
  --brand: #2AA9F0; --brand-soft: #12355A; --on-brand: #05203A; --side-bg: #060F1B; --side-active: rgba(245, 183, 0, .14);
  --s-new: #8EB1F2; --s-new-bg: #182847; --s-picked: #B79BF0; --s-picked-bg: #2A2047;
  --s-out: #F2B558; --s-out-bg: #3A2A10; --s-delivered: #5FD494; --s-delivered-bg: #123422;
  --s-returned: #F08A85; --s-returned-bg: #3F1B19; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.logo { display: block; flex: none; }
.logo .logo-bg { fill: var(--accent); }
.logo .logo-fg { fill: none; stroke: var(--logo-fg); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side-bg); color: var(--side-ink); display: flex; flex-direction: column; gap: 28px; padding: 22px 14px; }
.brand { display: flex; align-items: center; gap: 12px; padding-inline: 8px; }
.brand b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.1; font-weight: 600; }
.brand small { display: block; color: var(--side-muted); font-size: 12px; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; background: none; border: 0; color: var(--side-muted); padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: start; font-weight: 500; }
.nav-item:hover { background: var(--side-hover); color: var(--side-ink); }
.nav-item[aria-current="page"] { background: var(--side-active); color: var(--side-ink); }
.nav-item[aria-current="page"] svg { color: var(--accent); }
.side-foot { margin-top: auto; color: var(--side-muted); font-size: 12px; padding-inline: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 20px; }
.mini-brand { display: none; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.tb-actions { display: flex; gap: 8px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 13px; }
.icon-btn:hover { border-color: var(--brand); }
.content { padding: 22px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)); max-width: 1180px; width: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: auto 0 0 0; height: auto; z-index: 20; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 0; border-top: 1px solid rgba(255, 255, 255, .08); }
  .side .brand, .side .side-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-between; gap: 2px; }
  .nav-item { flex: 1; flex-direction: column; gap: 3px; padding: 7px 4px; font-size: 11px; text-align: center; min-width: 0; }
  .nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .mini-brand { display: flex; }
  .topbar h1 { display: none; }
  .content { padding-bottom: 96px; }
}

/* ---------- common ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card > h2 { font-size: 16px; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.banner { font-size: 13px; padding: 10px 14px; border-radius: 10px; background: var(--s-out-bg); color: var(--s-out); }
.toast { font-size: 13px; padding: 10px 14px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-weight: 600; padding: 9px 18px; cursor: pointer; }
.btn:hover { filter: brightness(1.07); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--brand); filter: none; }
.btn.danger { background: transparent; color: var(--s-returned); border: 1px solid var(--line); font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; filter: none; }

.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted); }
.field input { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; font-variant-numeric: tabular-nums; }
.field input:focus { border-color: var(--brand); outline: none; background: var(--surface); }

details.add { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 4px 20px; }
details.add[open] { padding-block: 14px 18px; }
details.add summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; padding-block: 10px; list-style: none; display: flex; align-items: center; gap: 10px; color: var(--brand); }
details.add summary::-webkit-details-marker { display: none; }
details.add form { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }

/* ---------- kpis ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .top { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.tile .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.tile .ic svg { width: 18px; height: 18px; }
.tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.35; margin-top: 4px; }
.tile .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .n { font-size: 12px; color: var(--muted); }
.tile.pos .v { color: var(--s-delivered); } .tile.neg .v { color: var(--s-returned); }
.tile.pos .ic { background: var(--s-delivered-bg); color: var(--s-delivered); } .tile.neg .ic { background: var(--s-returned-bg); color: var(--s-returned); }

.pipe { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.pipe i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 12px; border-radius: 99px; font-weight: 500; }
.dot b { font-variant-numeric: tabular-nums; }
.c-new { background: var(--s-new-bg); color: var(--s-new); } .c-picked_up { background: var(--s-picked-bg); color: var(--s-picked); }
.c-out_for_delivery { background: var(--s-out-bg); color: var(--s-out); } .c-delivered { background: var(--s-delivered-bg); color: var(--s-delivered); }
.c-returned { background: var(--s-returned-bg); color: var(--s-returned); }
.f-new { background: var(--s-new); } .f-picked_up { background: var(--s-picked); } .f-out_for_delivery { background: var(--s-out); } .f-delivered { background: var(--s-delivered); } .f-returned { background: var(--s-returned); }
.progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }

/* ---------- table ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.search { flex: 1; min-width: 180px; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 8px 12px; }
.search:focus { border-color: var(--brand); outline: none; background: var(--surface); }
.tablewrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; min-width: 780px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: start; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 10px; white-space: nowrap; }
td { padding: 11px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
td.code { font-family: var(--font-display); font-size: 13px; color: var(--muted); white-space: nowrap; }
td.m { font-weight: 600; }
td small { display: block; color: var(--muted); font-size: 12px; }
select.mini { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1px solid transparent; border-radius: 99px; padding: 5px 10px; max-width: 160px; cursor: pointer; }
select.mini:focus { border-color: var(--brand); outline: none; }
select.st-new { background: var(--s-new-bg); color: var(--s-new); } select.st-picked_up { background: var(--s-picked-bg); color: var(--s-picked); }
select.st-out_for_delivery { background: var(--s-out-bg); color: var(--s-out); } select.st-delivered { background: var(--s-delivered-bg); color: var(--s-delivered); }
select.st-returned { background: var(--s-returned-bg); color: var(--s-returned); }
.icon-del { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.icon-del:hover { background: var(--s-returned-bg); color: var(--s-returned); }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; }
.empty b { display: block; color: var(--ink); font-family: var(--font-display); margin-bottom: 4px; }

/* ---------- cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.person { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-family: var(--font-display); font-weight: 600; font-size: 17px; flex: none; }
.person b { font-family: var(--font-display); font-weight: 600; display: block; line-height: 1.3; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.kv b { font-variant-numeric: tabular-nums; font-weight: 600; }
.due { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.due small { font-size: 13px; color: var(--muted); font-weight: 500; }
.sep { height: 1px; background: var(--line); }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: 14px; }
.bar .track { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 99px; }
.bar .num { text-align: end; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar.rev i { background: var(--s-new); } .bar.cost i { background: var(--s-out); } .bar.gain i { background: var(--s-delivered); }
@media (max-width: 520px) { .bar { grid-template-columns: 100px minmax(0, 1fr) 56px; gap: 8px; } }
.result { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }

/* ---------- auth ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.auth-hero { background: var(--side-bg); color: var(--side-ink); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.auth-hero h2 { font-size: 34px; line-height: 1.3; max-width: 16ch; }
.auth-hero p { color: var(--side-muted); max-width: 38ch; margin-top: 14px; }
.auth-hero .brand b { font-size: 26px; }
.auth-pane { padding: 28px max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
.auth-pane .tb-actions { align-self: flex-end; }
.auth-form { margin: auto; width: min(380px, 100%); display: flex; flex-direction: column; gap: 18px; padding-block: 24px; }
.auth-form h2 { font-size: 26px; }
.auth-mobile-brand { display: none; align-items: center; gap: 12px; }
.auth-mobile-brand b { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
@media (max-width: 860px) {
  .auth { grid-template-columns: minmax(0, 1fr); }
  .auth-hero { display: none; }
  .auth-mobile-brand { display: flex; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===================== MODERN / 3D UPGRADE ===================== */
:root {
  --radius-lg: 20px; --radius-md: 14px;
  --shadow-soft: 0 1px 2px rgba(14,26,43,.04), 0 8px 24px rgba(14,26,43,.06);
  --shadow-lift: 0 2px 4px rgba(14,26,43,.05), 0 16px 40px rgba(10,110,190,.14);
  --shadow-btn: 0 2px 6px rgba(10,110,190,.30), 0 8px 20px rgba(10,110,190,.22);
  --brand-2: #1A9CF0;
  --grad-brand: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-2: #38BDF8; --grad-brand: linear-gradient(135deg, #0A84D8 0%, #38BDF8 100%);
    --shadow-soft: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.30);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.3), 0 16px 40px rgba(42,169,240,.16);
    --shadow-btn: 0 2px 6px rgba(0,0,0,.35), 0 10px 22px rgba(42,169,240,.25);
  }
}
:root[data-theme="dark"] {
  --brand-2: #38BDF8; --grad-brand: linear-gradient(135deg, #0A84D8 0%, #38BDF8 100%);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.30);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.3), 0 16px 40px rgba(42,169,240,.16);
  --shadow-btn: 0 2px 6px rgba(0,0,0,.35), 0 10px 22px rgba(42,169,240,.25);
}

/* ---------- shell / sidebar: gradient + glow ---------- */
.side { overflow: hidden; background: linear-gradient(165deg, #12355A 0%, var(--side-bg) 45%, #060F1B 100%); padding: 24px 16px; }
.side::before, .side::after { content: ""; position: absolute; border-radius: 50%; filter: blur(48px); pointer-events: none; z-index: 0; }
.side::before { width: 260px; height: 260px; top: -90px; inset-inline-start: -80px; background: radial-gradient(circle, rgba(245,183,0,.22), transparent 65%); }
.side::after { width: 240px; height: 240px; bottom: -80px; inset-inline-end: -70px; background: radial-gradient(circle, rgba(42,169,240,.28), transparent 65%); }
.side > * { position: relative; z-index: 1; }
.brand b { background: linear-gradient(120deg, #fff 30%, #D2E6F8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.nav { gap: 6px; }
.nav-item { border-radius: 12px; padding: 11px 14px; transition: transform .18s ease, background .18s ease, color .18s ease; }
.nav-item:hover { transform: translateX(-3px); }
[dir="ltr"] .nav-item:hover { transform: translateX(3px); }
.nav-item:active { transform: scale(.97); }
.nav-item[aria-current="page"] { background: linear-gradient(135deg, rgba(245,183,0,.20), rgba(245,183,0,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.18); }
.nav-item[aria-current="page"] svg { filter: drop-shadow(0 2px 6px rgba(245,183,0,.45)); }

/* ---------- topbar: deeper glass ---------- */
.topbar { background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(14px) saturate(1.3); }
.icon-btn { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.icon-btn:hover { border-color: var(--brand); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.icon-btn:active { transform: scale(.95); }

/* ---------- cards & tiles: soft 3D depth ---------- */
.card, .tile, details.add { border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); transition: transform .22s cubic-bezier(.2,.7,.3,1.2), box-shadow .22s ease; }
.card:hover, .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.card { position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--accent)); opacity: .55; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.card > * { position: relative; }
.tile .ic { background: var(--grad-brand); color: #fff; box-shadow: 0 4px 10px rgba(10,110,190,.35), inset 0 1px 0 rgba(255,255,255,.25); }

  el('sp-close').addEventListener('click', function () {
    var th = spCur(); if (!th) return;
    sb.rpc('admin_support_close', { p_thread: th.id, p_closed: th.status !== 'closed' }).then(function (r) { if (!r.error) spLoadList(); });
  });
  el('sp-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var th = spCur(), inp = el('sp-in'), v = inp.value.trim(); if (!th || !v) return;
    el('sp-send').disabled = true;
    sb.rpc('admin_support_reply', { p_thread: th.id, p_body: v }).then(function (r) {
      el('sp-send').disabled = false;
      if (r.error) { toast(t('sp_err')); return; }
      inp.value = ''; spLoadMsgs(false); spLoadList();
    });
  });
  el('sp-in').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el('sp-form').requestSubmit(); } });
  /* ---------- bot knowledge ---------- */
  function kbRender() {
    el('kb-list').innerHTML = SUP.kb.length ? SUP.kb.map(function (k) {
      return '<div class="kb-item' + (k.active ? '' : ' off') + '"><div class="kq">' + esc(k.question) + '</div><div class="ka">' + esc(k.answer) + '</div><div class="acts"><button type="button" data-kbe="' + k.id + '">' + esc(t('kb_edit')) + '</button><button type="button" data-kbt="' + k.id + '">' + esc(t(k.active ? 'kb_off' : 'kb_on')) + '</button><button type="button" data-kbd="' + k.id + '">' + esc(t('kb_del')) + '</button></div></div>';
    }).join('') : '<p class="note">' + esc(t('kb_none')) + '</p>';
  }
  function kbLoad() { return sb.rpc('admin_bot_kb_list').then(function (r) { if (!r.error && Array.isArray(r.data)) { SUP.kb = r.data; kbRender(); } }); }
  function kbReset() { el('kb-form').removeAttribute('data-id'); el('kb-q').value = ''; el('kb-a').value = ''; el('kb-cancel').hidden = true; }
  function kbSaveRow(id, q, a, active) {
    return sb.rpc('admin_bot_kb_save', { p_id: id || null, p_q: q, p_a: a, p_active: active }).then(function (r) { if (r.error) { toast(t('kb_err')); return false; } return kbLoad().then(function () { return true; }); });
  }
  el('kb-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = el('kb-q').value.trim(), a = el('kb-a').value.trim(); if (q.length < 2 || a.length < 2) { toast(t('kb_err')); return; }
    var id = el('kb-form').getAttribute('data-id'), cur = SUP.kb.filter(function (k) { return k.id === id; })[0];
    kbSaveRow(id, q, a, cur ? cur.active : true).then(function (ok) { if (ok) { kbReset(); toast(t('kb_saved')); } });
  });
  el('kb-cancel').addEventListener('click', kbReset);
  el('kb-list').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var id = b.getAttribute('data-kbe') || b.getAttribute('data-kbt') || b.getAttribute('data-kbd');
    var k = SUP.kb.filter(function (x) { return x.id === id; })[0]; if (!k) return;
    if (b.hasAttribute('data-kbe')) { el('kb-form').setAttribute('data-id', k.id); el('kb-q').value = k.question; el('kb-a').value = k.answer; el('kb-cancel').hidden = false; el('kb-q').focus(); el('kb-card').scrollIntoView({ block: 'start' }); }
    else if (b.hasAttribute('data-kbt')) kbSaveRow(k.id, k.question, k.answer, !k.active);
    else if (window.confirm(t('kb_del_q'))) sb.rpc('admin_bot_kb_delete', { p_id: k.id }).then(function (r) { if (!r.error) { if (el('kb-form').getAttribute('data-id') === k.id) kbReset(); kbLoad(); } });
  });
  el('sp-msgs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-teach]'); if (!b) return;
    var x = SUP.teach[+b.getAttribute('data-teach')]; if (!x) return;
    kbReset(); el('kb-q').value = x.q.slice(0, 300); el('kb-a').value = x.a.slice(0, 1200);
    toast(t('kb_filled')); el('kb-card').scrollIntoView({ block: 'start', behavior: 'smooth' }); el('kb-q').focus();
  });
  function syncAll() { return Promise.all([refresh('merchants'), refresh('shipments'), refresh('couriers'), refreshCfg(), loadMerchantReqs(), loadAreasAdmin(), loadCourierLog(), loadHandovers(), loadIndOrders(), loadExpenses()]); }
  async function startData() {
    if (started) return; started = true; spStart(); if (location.hash === '#support') { try { setTab('sp'); } catch (e) {} }
    try { await syncAll(); banner(null); } catch (e) { banner('bn_read'); }
    channel = sb.channel('bareed').on('postgres_changes', { event: '*', schema: 'public' }, function () {
      clearTimeout(syncTimer); syncTimer = setTimeout(function () { syncAll().catch(function () {}); }, 400);
    }).subscribe();
    if (!window._ap) { window._ap = setInterval(function () { if (started && document.visibilityState === 'visible') syncAll().catch(function () {}); }, 30000); document.addEventListener('visibilitychange', function () { if (started && document.visibilityState === 'visible') syncAll().catch(function () {}); }); }
  }
  function stopData() {
    started = false; spStop(); store.shipments = []; store.couriers = []; store.merchants = []; loaded.shipments = loaded.couriers = false;
    if (channel) { sb.removeChannel(channel); channel = null; }
    renderAll();
  }
  function authMsg(k) { var m = el('auth-msg'); m.setAttribute('data-k', k || ''); m.textContent = k ? t(k) : ''; }
  async function enter() {
    var r = await sb.from('admins').select('user_id').maybeSingle();
    if (r.error) { authMsg('err_admin'); showApp(false); return; }
    if (!r.data) { authMsg('err_admin'); await sb.auth.signOut({ scope: 'local' }); showApp(false); return; }
    showApp(true); startData();
  }

  (function boot() {
    if (!window.supabase) { local = true; loaded.shipments = loaded.couriers = true; banner('bn_local'); showApp(true); renderAll(); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'bareed-admin-auth' } });
    sbPub = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    window.addEventListener('hashchange', openTrackFromHash);
    sb.auth.getSession().then(function (r) { if (r.data && r.data.session) enter(); else showApp(false); openTrackFromHash(); });
    sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') { stopData(); showApp(false); } });
    el('form-auth').addEventListener('submit', async function (e) {
      e.preventDefault();
      var r = await sb.auth.signInWithPassword({ email: el('a-email').value.trim(), password: el('a-pass').value });
      if (r.error) { authMsg('err_login'); return; }
      authMsg(''); el('a-pass').value = ''; enter();
    });
    el('logout').addEventListener('click', async function () { await sb.auth.signOut({ scope: 'local' }); location.href = '/app'; });
  })();
})();
</script>
<script src="/push.js" data-key="bareed-admin-auth" data-mode="auth" data-pos="top" defer></script>
</body></html>
