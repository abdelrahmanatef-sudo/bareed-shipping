function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $('l-t').textContent=t('title');$('l-s').textContent=t('sub');$('l-e').textContent=t('email');$('l-p').textContent=t('pass');$('go').textContent=t('go');$('lg0').textContent=t('lang');$('lg').textContent=t('lang');$('out').textContent=t('out');$('sub').textContent=t('title');
 var d=new Date();$('today').textContent=d.toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{weekday:'long',day:'numeric',month:'long'});if(me)render()}
function swap(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('bl',lang)}catch(e){}applyLang()}
$('lg').onclick=swap;$('lg0').onclick=swap;$('rf').onclick=function(){load()};
function money(n){return Math.round(+n||0).toLocaleString('en-US')}
function render(){
 $('hello').textContent=t('hello').replace('{n}',me.name);
 var mine=rows.filter(function(r){return ['new','picked_up','out_for_delivery'].indexOf(r.status)>-1});
 var cash=rows.filter(function(r){return r.status==='delivered'&&!r.courier_settled}).reduce(function(n,r){return n+(+r.cod||0)},0);
 var d0=new Date();d0.setHours(0,0,0,0);
 var dn=rows.filter(function(r){return r.status==='delivered'&&new Date(r.updated_at)>=d0}).length;
 $('tiles').innerHTML='<div class="tile a"><div class="l">'+t('now')+'</div><div class="v">'+mine.length+'</div></div><div class="tile"><div class="l">'+t('cash')+'</div><div class="v">'+money(cash)+'</div></div><div class="tile"><div class="l">'+t('dn')+'</div><div class="v">'+dn+'</div></div>';
 $('tabs').innerHTML=[1,2,3].map(function(i){return '<button role="tab" data-t="'+i+'" aria-selected="'+(tab===i)+'">'+t('t'+i)+'</button>'}).join('');
 var h='';
 if(tab===3){h=logs.length?'<div class="card"><div class="log">'+logs.map(function(l){var a=t('act')[l.action]||l.action;var s=l.action==='status'?' → '+(t('st')[l.to_status]||l.to_status):'';return '<div><span><b>'+esc(l.shipment_code||'')+'</b> · '+esc(a+s)+(l.note?'<small>'+esc(l.note)+'</small>':'')+'</span><span class="m" style="white-space:nowrap">'+new Date(l.created_at).toLocaleString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span></div>'}).join('')+'</div></div>':'<div class="empty">'+t('none')+'</div>'}
 else{var list=tab===1?mine:rows.filter(function(r){return r.status==='delivered'||r.status==='returned'});
  var carr=tab===1?mine.reduce(function(n,r){return n+(+r.cod||0)},0):0;
   h=(tab===1&&mine.length?'<div class="row" style="padding:4px 6px"><span class="m">'+t('carr')+'</span><b>'+money(carr)+' '+t('cur')+'</b></div>':'')+(list.length?list.map(card).join(''):'<div class="empty">'+t('none')+'</div>')}
 var st=loadErr?'<div class="m" style="color:var(--warn);padding:4px 6px">'+t('lerr')+'</div>':(lastOk?'<div class="m" style="padding:2px 6px">'+t('upd')+': '+lastOk.toLocaleTimeString(lang==='ar'?'ar-EG':'en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</div>':'');
 $('list').innerHTML=st+(tab===3?'':handCard())+h;$('avl').innerHTML='<button class="btn '+(me.available===false?'g':'')+'" data-av="1" style="width:100%">'+t(me.available===false?'av_off':'av_on')+'</button><div class="m" style="margin-top:4px;font-size:12px">'+t('av_hint')+'</div>'}
function handCard(){var pend=hos.filter(function(h){return h.status==='pending'})[0];var hold=rows.filter(function(r){return r.status==='delivered'&&!r.courier_settled});var tot=hold.reduce(function(n,r){return n+(+r.cod||0)},0);var h='<div class="card"><div class="row"><b>'+t('hcard')+'</b></div>';
 if(pend)h+='<div class="m" style="color:var(--warn)">'+t('hpend').replace('{m}',money(pend.claimed_amount))+'</div>';
 else if(hold.length)h+='<div class="row"><span class="m">'+hold.length+' · '+t('cash')+'</span><b>'+money(tot)+' '+t('cur')+'</b></div><button class="btn" data-hand="1">'+t('hbtn')+'</button>';
 else h+='<div class="m">'+t('hnone')+'</div>';
 var done=hos.filter(function(x){return x.status!=='pending'}).slice(0,3);
 if(done.length)h+='<div class="log" style="margin-top:8px"><div class="m">'+t('hhist')+'</div>'+done.map(function(x){var d=new Date(x.created_at).toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'});var sh=x.status==='confirmed'?(+x.claimed_amount-(+x.received_amount)):0;return '<div><span>'+d+' · '+(x.status==='rejected'?t('hrej'):t('hok').replace('{m}',money(x.received_amount)))+(sh>0?' · <b style="color:var(--warn)">'+t('hshort').replace('{m}',money(sh))+'</b>':sh<0?' · '+t('hsurp').replace('{m}',money(-sh)):'')+'</span></div>'}).join('')+'</div>';
 return h+'</div>'}
function msg(r,kind){var mm=r.merchant?(lang==='ar'?' من '+r.merchant:' from '+r.merchant):'';var tx=t(kind).replace('{c}',r.customer_name||'').replace('{k}',r.code).replace('{m}',mm).replace('{a}',money(r.cod));if(kind!=='m_arr')tx+='\n'+(lang==='ar'?'تتبّع شحنتك: ':'Track your shipment: ')+location.origin+'/?t='+encodeURIComponent(r.code);return tx}
function waLink(r,kind){var ph=String(r.customer_phone||'').replace(/[^0-9+]/g,'').replace(/^\+/,'').replace(/^0/,'20');return 'https://wa.me/'+ph+'?text='+encodeURIComponent(msg(r,kind))}
function card(r){
 var ph=String(r.customer_phone||'').replace(/[^0-9+]/g,''),wa=ph.replace(/^\+/,'').replace(/^0/,'20');
 var b='';
 if(r.status==='new')b='<button class="btn" data-a="recv" data-id="'+esc(r.id)+'">'+t('pick')+'</button>';
 else if(r.status==='picked_up')b='<button class="btn" data-a="out_for_delivery" data-id="'+esc(r.id)+'">'+t('outb')+'</button>';
 else if(r.status==='out_for_delivery')b='<button class="btn" data-a="delivered" data-id="'+esc(r.id)+'" data-cod="'+esc(r.cod)+'">'+t('deliv')+'</button>'+((+r.attempts||0)<3?'<button class="btn g" data-a="attempt" data-id="'+esc(r.id)+'">'+t('atb')+'</button>':'')+'<button class="btn r" data-a="returned" data-id="'+esc(r.id)+'">'+t('ret')+'</button>';
 var live=['new','picked_up','out_for_delivery'].indexOf(r.status)>-1;
 var rq=r.req_stage&&r.req_stage!=='approved',isE=!!r.req_stage,hasPh=!!r.customer_phone;
 if(rq){b='';if(r.req_stage==='pending')b='<button class="btn" data-a="accept" data-id="'+esc(r.id)+'">'+t('qacc')+'</button>';
  else if(r.req_stage!=='declined')b='<div class="field" style="width:100%"><input class="qin" id="q-'+esc(r.id)+'" inputmode="decimal" dir="ltr" placeholder="'+esc(t('qph'))+'" value="'+esc(r.quote||'')+'" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line,#cfd8e3);font:inherit"></div><button class="btn" data-a="quote" data-id="'+esc(r.id)+'">'+t('qsend')+'</button>'}
 else if(isE&&r.status==='new')b='<button class="btn" data-a="recv" data-id="'+esc(r.id)+'">'+t('qstart')+'</button>';
 return '<div class="card"><div class="row"><span class="code">'+esc(r.code)+'</span><span class="chip s-'+esc(r.status)+'">'+esc(rq?t('rq_'+r.req_stage):(t('st')[r.status]||r.status))+(r.status==='delivered'&&r.courier_settled?' · '+t('set'):'')+'</span></div>'+
  '<div><b>'+esc(r.customer_name)+'</b><div class="m">'+esc(r.address)+(r.zone?' · '+esc(r.zone):'')+'</div>'+(r.merchant?'<div class="m">'+esc(r.merchant)+'</div>':'')+'</div>'+
   (isE&&r.notes?'<div class="card" style="padding:10px;margin:0"><div class="m">'+t('qreq')+'</div><div>'+esc(r.notes)+'</div></div>':'')+(rq&&!hasPh?'<div class="m">'+t('qhid')+'</div>':'')+(rq&&r.req_stage==='quoted'?'<div class="m">'+t('qwait')+': <b>'+money(r.quote)+' '+t('cur')+'</b></div>':'')+(r.status==='new'&&!isE?'<div class="card" style="padding:10px;margin:0"><div class="m">'+t('frm')+'</div><div><b>'+esc(r.merchant||'')+'</b></div>'+(r.merchant_address?'<div class="m">'+t('madr')+': '+esc(r.merchant_address)+'</div>':'')+'<div class="acts">'+(r.merchant_phone?'<a class="btn g" href="tel:'+esc(String(r.merchant_phone||'').replace(/[^0-9+]/g,''))+'">'+t('callm')+'</a>':'')+(r.merchant_address?'<a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.merchant_address)+'">'+t('map')+'</a>':'')+'</div></div>':'')+
  ((+r.attempts||0)>0&&r.status==='out_for_delivery'?'<div class="m" style="color:var(--warn)">'+t('att')+': '+r.attempts+'/3'+(r.next_attempt?' · '+t('nxt')+': '+esc(r.next_attempt):'')+((+r.attempts)>=3?'<br>'+t('maxw'):'')+'</div>':'')+
  (rq?'':'<div class="row"><span class="m">'+t('cod')+'</span><span class="cod">'+money(r.cod)+' <small class="m">'+t('cur')+'</small></span></div>')+
  (live&&(!isE||hasPh)?'<div class="acts"><a class="btn g" href="tel:'+esc(ph)+'">'+t('call')+'</a><a class="btn g" target="_blank" rel="noopener" href="'+esc(waLink(r,r.status==='out_for_delivery'?'m_out':'m_pick'))+'">'+t('wa')+'</a>'+(r.status==='out_for_delivery'?'<a class="btn g" target="_blank" rel="noopener" href="'+esc(waLink(r,'m_arr'))+'">'+t('arr')+'</a>':'')+'<a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.address+' '+(r.zone||''))+'">'+t('map')+'</a></div>':'')+
  (b?'<div class="acts">'+b+'</div>':'')+'</div>'}
function askReason(mode){return new Promise(function(res){
 var att=mode==='att',box=$('rs'),L=att?t('ar'):t('rr');$('rs-t').textContent=att?t('at'):t('cr');$('rs-x').textContent=t('cn');$('rs-ok').textContent=att?t('atok'):t('rok');
 $('rs-list').innerHTML=L.map(function(x,i){return '<label><input type="radio" name="rs" value="'+i+'"'+(i===0?' checked':'')+'><span>'+esc(x)+'</span></label>'}).join('');
 var o=$('rs-o');o.value='';o.hidden=true;o.placeholder=t('ro');
 var d=$('rs-d');d.hidden=!att;if(att)d.innerHTML=['d0','d1','d2'].map(function(k,i){return '<option value="'+i+'"'+(i===1?' selected':'')+'>'+t(k)+'</option>'}).join('');
 $('rs-list').onchange=function(){var v=+document.querySelector('input[name=rs]:checked').value;o.hidden=v!==L.length-1};
 function done(v){box.hidden=true;$('rs-ok').onclick=$('rs-x').onclick=null;res(v)}
 $('rs-x').onclick=function(){done(null)};
 $('rs-ok').onclick=function(){var v=+document.querySelector('input[name=rs]:checked').value;var txt=v===L.length-1?(o.value.trim()||L[v]):L[v];
  if(!att)return done(txt);var dt=new Date();dt.setDate(dt.getDate()+(+d.value));done({note:txt,date:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')})};
 box.hidden=false})}
function getPos(){return new Promise(function(res){if(!navigator.geolocation)return res({});navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res({})},{timeout:3500,maximumAge:60000})})}
$('avl').addEventListener('click',async function(e){var b=e.target.closest('[data-av]');if(!b)return;b.disabled=true;var nv=me.available===false;var r=await sb.rpc('courier_set_available',{p_available:nv});if(r.error){toast(t('err'))}else{me.available=nv;toast(t('ok'))}render()});
$('list').addEventListener('click',async function(e){var hb=e.target.closest('[data-hand]');if(hb){var hold=rows.filter(function(r){return r.status==='delivered'&&!r.courier_settled});var tot=hold.reduce(function(n,r){return n+(+r.cod||0)},0);if(!confirm(t('hconf').replace('{m}',tot)))return;hb.disabled=true;var hr=await sb.rpc('courier_submit_handover',{p_note:null});if(hr.error){toast(t('err'));hb.disabled=false}else toast(t('ok'));await load();return}
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),note=null;
 if(a==='accept'||a==='quote'){var rr0;b.disabled=true;
 if(a==='accept')rr0=await sb.rpc('courier_accept_request',{p_shipment:id});
 else{var qv=parseFloat(String((document.getElementById('q-'+id)||{}).value||'').replace(/[^0-9.]/g,''));if(!(qv>0)){toast(t('qbad'));b.disabled=false;return}rr0=await sb.rpc('courier_set_quote',{p_shipment:id,p_amount:qv})}
 if(rr0.error){toast(t('err'));b.disabled=false}else toast(t('ok'));await load();return}
 if(a==='delivered'&&!confirm(t('cd').replace('{m}',money(b.getAttribute('data-cod')))))return;
 var att=null;
 if(a==='returned'){note=await askReason();if(note===null)return}
 if(a==='attempt'){att=await askReason('att');if(att===null)return}
 b.disabled=true;var pos=await getPos();
 var r,pp={p_note:note,p_lat:pos.lat||null,p_lng:pos.lng||null};
 if(att)r=await sb.rpc('courier_failed_attempt',{p_shipment:id,p_reason:att.note,p_date:att.date,p_lat:pos.lat||null,p_lng:pos.lng||null});
 else if(a==='recv'){r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:'picked_up'},pp));if(!r.error)r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:'out_for_delivery'},pp))}
 else r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:a},pp));
 if(r.error){toast(t('err'));b.disabled=false}else{toast(t('ok'))}
 await load()});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){tab=+b.getAttribute('data-t');render()}});
var lastOk=null,loadErr=false;
async function load(){
 var rb=$('rf');if(rb)rb.disabled=true;
 var r=await sb.rpc('courier_my_shipments');
 if(r.error){loadErr=true;toast(t('lerr'))}else{loadErr=false;rows=r.data||[];lastOk=new Date()}
 var hr=await sb.rpc('courier_my_handovers');if(!hr.error)hos=hr.data||[];
 var l=await sb.from('courier_log').select('shipment_code,action,to_status,note,created_at').order('created_at',{ascending:false}).limit(200);if(!l.error)logs=l.data||[];
 if(rb)rb.disabled=false;if(!(document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('qin')))render()}
function renderKyc(){$('k-t').textContent=t('k_t');$('k-s').textContent=t('k_s');$('k-nl').textContent=t('k_n');$('k-fl').textContent=t('k_f');$('k-bl').textContent=t('k_b');$('k-sl').textContent=t('k_se');$('k-ct').textContent=t('k_c');$('k-go').textContent=t('k_go');$('k-out').textContent=t('out');
 $('k-rj').textContent=me&&me.kyc_reject_reason?t('k_rj')+' '+me.kyc_reject_reason:(me&&me.id_status==='rejected'?t('k_rj'):'')}
function showKyc(){$('login').hidden=true;$('app').hidden=true;$('kyc').hidden=false;renderKyc()}
function packImg(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var m=1400,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('img'))},'image/jpeg',0.82)};im.onerror=function(){rej(new Error('img'))};im.src=u})}
[['k-f','k-fp'],['k-b','k-bp'],['k-se','k-sp']].forEach(function(p){$(p[0]).addEventListener('change',function(){var f=this.files[0],i=$(p[1]);if(f){i.src=URL.createObjectURL(f);i.style.display='block'}else i.style.display='none'})});
$('k-out').onclick=async function(){await sb.auth.signOut({scope:'local'});location.reload()};
$('k-go').onclick=async function(){
 var err=$('k-err');err.textContent='';var n=$('k-n').value.replace(/\s/g,''),fs=[$('k-f').files[0],$('k-b').files[0],$('k-se').files[0]];
 if(!n||!fs[0]||!fs[1]||!fs[2]||!$('k-c').checked){err.textContent=t('k_miss');return}
 var b=$('k-go');b.disabled=true;b.textContent=t('k_sending');
 try{
  var names=['front','back','selfie'];
  for(var i=0;i<3;i++){var blob=await packImg(fs[i]);var up=await sb.storage.from('kyc').upload(me.id+'/'+names[i]+'.jpg',blob,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error}
  var r=await sb.rpc('courier_submit_kyc',{p_national_id:n,p_consent:true,p_ocr_ok:null});
  if(r.error){var m=r.error.message||'';err.textContent=/bad_id/.test(m)?t('k_bad'):/duplicate/.test(m)?t('k_dup'):/bad_age/.test(m)?t('k_age'):t('k_fail');b.disabled=false;b.textContent=t('k_go');return}
  $('kyc').hidden=true;b.disabled=false;b.textContent=t('k_go');await enter()
 }catch(e){err.textContent=t('k_fail');b.disabled=false;b.textContent=t('k_go')}
};
async function enter(){
 var ss=await sb.auth.getSession();var uid=ss.data&&ss.data.session?ss.data.session.user.id:null;
 var c=uid?await sb.from('couriers').select('id,name,phone,status,available,id_status,kyc_reject_reason').eq('user_id',uid).maybeSingle():{data:null};
 if(c.error){$('app').hidden=true;$('login').hidden=false;$('err').textContent=t('bad');return}
 if(!c.data||c.data.status!=='active'){var bad=!!(c.data&&c.data.status!=='active');await sb.auth.signOut({scope:'local'});$('app').hidden=true;$('login').hidden=false;$('err').textContent=t(bad?'susp':'notc');return}
 me=c.data;if(me.id_status==='none'||me.id_status==='rejected'){showKyc();return}
 $('kyc').hidden=true;$('login').hidden=true;$('app').hidden=false;if(me.id_status==='pending')toast(t('k_wait'));await load();
 if(!window._poll){window._poll=setInterval(function(){if(document.visibilityState==='visible')load()},30000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&me)load()})}}
$('go').onclick=async function(){
 $('err').textContent='';var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('err').textContent=t('bad');return}await enter()};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('out').onclick=async function(){await sb.auth.signOut({scope:'local'});location.reload()};
applyLang();
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)enter();else $('login').hidden=false});
})();
</script></body></html>
