.sheet-box textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;resize:none}

  ((+r.attempts||0)>0&&r.status==='out_for_delivery'?'<div class="m" style="color:var(--warn)">'+t('att')+': '+r.attempts+'/3'+(r.next_attempt?' · '+t('nxt')+': '+esc(r.next_attempt):'')+((+r.attempts)>=3?'<br>'+t('maxw'):'')+'</div>':'')+
  '<div class="row"><span class="m">'+t('cod')+'</span><span class="cod">'+money(r.cod)+' <small class="m">'+t('cur')+'</small></span></div>'+
  (live?'<div class="acts"><a class="btn g" href="tel:'+esc(ph)+'">'+t('call')+'</a><a class="btn g" target="_blank" rel="noopener" href="'+esc(waLink(r,r.status==='out_for_delivery'?'m_out':'m_pick'))+'">'+t('wa')+'</a>'+(r.status==='out_for_delivery'?'<a class="btn g" target="_blank" rel="noopener" href="'+esc(waLink(r,'m_arr'))+'">'+t('arr')+'</a>':'')+'<a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.address+' '+(r.zone||''))+'">'+t('map')+'</a></div>':'')+
  (b?'<div class="acts">'+b+'</div>':'')+'</div>'}
function askReason(mode){return new Promise(function(res){
 var att=mode==='att',box=$('rs'),L=att?t('ar'):t('rr');$('rs-t').textContent=att?t('at'):t('cr');$('rs-x').textContent=t('cn');$('rs-ok').textContent=att?t('atok'):t('rok');
 $('rs-list').innerHTML=L.map(function(x,i){return '<label><input type="radio" name="rs" value="'+i+'"'+(i===0?' checked':'')+'><span>'+esc(x)+'</span></label>'}).join('');
 var o=$('rs-o');o.value='';o.hidden=true;o.placeholder=t('ro');
 var d=$('rs-d');d.hidden=!att;if(att)d.innerHTML=['d0','d1','d2'].map(function(k,i){return '<option value="'+i+'"'+(i===1?' selected':'')+'>'+t(k)+'</option>'}).join('');
 $('rs-list').onchange=function(){var v=+document.querySelector('input[name=rs]:checked').value;o.hidden=v!==L.length-1};
 function done(v){box.hidden=true;$('rs-ok').onclick=$('rs-x').onclick=null;res(v)}
 $('rs-x').onclick=function(){done(null)};
 $('rs-ok').onclick=function(){var v=+document.querySelector('input[name=rs]:checked').value;var txt=v===L.length-1?(o.value.trim()||L[v]):L[v];
  if(!att)return done(txt);var dt=new Date();dt.setDate(dt.getDate()+(+d.value));done({note:txt,date:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')})};
 box.hidden=false})}
function getPos(){return new Promise(function(res){if(!navigator.geolocation)return res({});navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude})},function(){res({})},{timeout:3500,maximumAge:60000})})}
$('list').addEventListener('click',async function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),note=null;
 if(a==='delivered'&&!confirm(t('cd').replace('{m}',money(b.getAttribute('data-cod')))))return;
 var att=null;
 if(a==='returned'){note=await askReason();if(note===null)return}
 if(a==='attempt'){att=await askReason('att');if(att===null)return}
 b.disabled=true;var pos=await getPos();
 var r,pp={p_note:note,p_lat:pos.lat||null,p_lng:pos.lng||null};
 if(att)r=await sb.rpc('courier_failed_attempt',{p_shipment:id,p_reason:att.note,p_date:att.date,p_lat:pos.lat||null,p_lng:pos.lng||null});
 else if(a==='recv'){r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:'picked_up'},pp));if(!r.error)r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:'out_for_delivery'},pp))}
 else r=await sb.rpc('courier_update_status',Object.assign({p_shipment:id,p_status:a},pp));
 if(r.error){toast(t('err'));b.disabled=false}else{toast(t('ok'))}
 await load()});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b){tab=+b.getAttribute('data-t');render()}});
var lastOk=null,loadErr=false;
async function load(){
 var rb=$('rf');if(rb)rb.disabled=true;
 var r=await sb.rpc('courier_my_shipments');
 if(r.error){loadErr=true;toast(t('lerr'))}else{loadErr=false;rows=r.data||[];lastOk=new Date()}
 var l=await sb.from('courier_log').select('shipment_code,action,to_status,note,created_at').order('created_at',{ascending:false}).limit(200);if(!l.error)logs=l.data||[];
 if(rb)rb.disabled=false;render()}
async function enter(){
 var c=await sb.from('couriers').select('name,phone,status').maybeSingle();
 if(c.error||!c.data||c.data.status!=='active'){var bad=!!(c.data&&c.data.status!=='active');await sb.auth.signOut();$('app').hidden=true;$('login').hidden=false;$('err').textContent=t(bad?'susp':'notc');return}
 me=c.data;$('login').hidden=true;$('app').hidden=false;await load();
 if(!window._poll){window._poll=setInterval(function(){if(document.visibilityState==='visible')load()},30000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&me)load()})}}
$('go').onclick=async function(){
 $('err').textContent='';var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('err').textContent=t('bad');return}await enter()};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
$('out').onclick=async function(){await sb.auth.signOut();location.reload()};
applyLang();
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)enter();else $('login').hidden=false});
})();
</script></body></html>
