name: Daily DB backup
on:
  schedule:
    - cron: '0 1 * * *'   # 03:00 Cairo
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DB_URL" && test -n "$PASS"
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth --schema=storage -Fc -f bareed.dump
          test -s bareed.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c --cipher-algo AES256 -o "bareed-$(date -u +%F).dump.gpg" bareed.dump
          rm bareed.dump
      - uses: actions/upload-artifact@v4
        with:
          name: bareed-backup
          path: bareed-*.dump.gpg
          retention-days: 30
