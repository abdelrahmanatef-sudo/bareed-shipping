    ships.forEach(function (s) {
      if (s.status === 'delivered') { c.del++; cod += +s.cod; if (!s.merchant_settled) due += +s.cod - +s.fee; }
      else if (s.status === 'returned') { c.ret++; }
      else c.open++;
    });
    var cur = '<small>' + t('cur') + '</small>';
    el('tiles').innerHTML = [['k_all', c.all, ''], ['k_open', c.open, ''], ['k_del', c.del, ''], ['k_ret', c.ret, ''], ['k_cod', fmt(cod) + ' ' + cur, ''], ['k_due', fmt(due) + ' ' + cur, 'accent']].map(function (x) {
      return '<div class="tile ' + x[2] + '"><div class="l">' + t(x[0]) + '</div><div class="v">' + x[1] + '</div></div>'; }).join('');
    var cnt = {}; STAT.forEach(function (k) { cnt[k] = 0; }); ships.forEach(function (s) { cnt[s.status] = (cnt[s.status] || 0) + 1; });
    el('pipe').innerHTML = STAT.map(function (k) { return cnt[k] ? '<i class="f-' + k + '" style="width:' + cnt[k] / ships.length * 100 + '%"></i>' : ''; }).join('');
    el('legend').innerHTML = STAT.map(function (k) { return '<span class="badge s-' + k + '">' + t('st_' + k) + ' ' + cnt[k] + '</span>'; }).join('');
  }
  function dt(iso, long) { try { return new Date(iso).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-GB', long ? { dateStyle: 'medium', timeStyle: 'short' } : { dateStyle: 'medium' }); } catch (e) { return ''; } }
  function renderRows() {
    var q = query.trim().toLowerCase();
    var list = ships.filter(function (s) { return (filter === 'all' || s.status === filter) && (!q || (s.code + ' ' + s.customer_name).toLowerCase().indexOf(q) !== -1); });
    el('rows').innerHTML = list.map(function (s) {
      return '<tr><td class="code">' + esc(s.code) + '</td><td>' + esc(s.customer_name) + '<small dir="ltr" style="text-align:start">' + esc(s.customer_phone) + '</small></td><td>' + esc(s.zone || '') + '<small>' + esc(s.address) + '</small></td>' +
        '<td>' + fmt(s.cod) + '</td><td>' + fmt(s.fee) + '</td><td><span class="badge s-' + s.status + '">' + t('st_' + s.status) + '</span></td><td>' + esc(dt(s.created_at)) + '</td>' +
        '<td><button class="btn ghost sm" type="button" data-track="' + esc(s.id) + '">' + t('track') + '</button></td></tr>'; }).join('');
    var em = el('empty'); em.hidden = !!list.length;
    if (!list.length) em.innerHTML = ships.length ? '<b>' + t('e_res') + '</b>' : '<b>' + t('e_none') + '</b>' + t('e_none_h');
    var FK = { all: 'fl_all', new: 'fl_new', picked_up: 'fl_picked_up', out_for_delivery: 'fl_out_for_delivery', delivered: 'fl_delivered', returned: 'fl_returned' };
    el('filters').innerHTML = Object.keys(FK).map(function (k) { return '<button class="chip" type="button" data-f="' + k + '" aria-pressed="' + (k === filter) + '">' + t(FK[k]) + '</button>'; }).join('');
  }
  function gname(a) { return lang === 'ar' ? a.gov_ar : a.gov_en; } function cname(a) { return lang === 'ar' ? a.city_ar : a.city_en; }
  function renderForm() {
    var gs = [], seen = {}; areas.forEach(function (a) { if (!seen[a.gov_ar]) { seen[a.gov_ar] = 1; gs.push(a); } });
    gs.sort(function (a, b) { return (b.open - a.open) || 0; });
    var open = {}; areas.forEach(function (a) { if (a.is_active) open[a.gov_ar] = 1; });
    var gsel = el('f-gov'), cur = gsel.value || 'الجيزة';
    gs.sort(function (a, b) { return (open[b.gov_ar] ? 1 : 0) - (open[a.gov_ar] ? 1 : 0); });
    gsel.innerHTML = gs.map(function (a) { return '<option value="' + esc(a.gov_ar) + '"' + (a.gov_ar === cur ? ' selected' : '') + '>' + esc(gname(a)) + '</option>'; }).join('');
    fillCities();
  }
  function fillCities() {
    var g = el('f-gov').value, csel = el('f-city'), prev = csel.value;
    var cs = areas.filter(function (a) { return a.gov_ar === g; }).sort(function (a, b) { return (b.is_active - a.is_active) || a.city_ar.localeCompare(b.city_ar, 'ar'); });
    csel.innerHTML = '<option value="">' + t('pick') + '</option>' + cs.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.is_active ? '' : ' disabled') + (a.id === prev ? ' selected' : '') + '>' + esc(cname(a)) + (a.is_active ? '' : ' · ' + t('soon')) + '</option>'; }).join('');
    showQuote();
  }
  function showQuote() {
    var a = areas.filter(function (x) { return x.id === el('f-city').value; })[0], q = el('quote');
    q.hidden = !a; if (a) q.textContent = t('quote', { c: cname(a), f: fmt(a.fee) });
  }
  function renderAll() { renderStatic(); if (me && me.status === 'active') { renderTiles(); renderRows(); renderForm(); } }

  /* data */
  async function load() {
    var r = await sb.from('shipments').select('id,code,customer_name,customer_phone,address,cod,fee,status,zone,merchant_settled,created_at').order('created_at', { ascending: false }).limit(1000);
    if (r.error) { toast('err', t('e_load')); return; }
    ships = r.data; renderAll();
  }
  async function loadAreas() { var r = await sb.from('areas').select('id,gov_ar,gov_en,city_ar,city_en,is_active,fee'); if (!r.error) areas = r.data; }

  async function start() {
    var s = await sb.auth.getSession();
    if (!s.data.session) { location.href = './'; return; }
    var a = await sb.from('admins').select('user_id').maybeSingle();
    if (a.data) { location.href = 'admin'; return; }
    var m = await sb.from('merchants').select('id,name,status').maybeSingle();
    el('load').hidden = true; el('app').hidden = false;
    if (m.error || !m.data) { me = { name: '', status: 'none' }; renderStatic(); el('dash').hidden = true; banner('bad', 'nomerchant'); return; }
    me = m.data; renderStatic();
    if (me.status !== 'active') { el('dash').hidden = true; banner(me.status === 'pending' ? 'wait' : 'bad', me.status === 'pending' ? 'pending' : 'suspended'); return; }
    banner('', null);
    await loadAreas(); renderAll(); await load();
    sb.channel('m-ships').on('postgres_changes', { event: '*', schema: 'public', table: 'shipments' }, function () { load(); }).subscribe();
  }

  /* events */
  el('f-gov').addEventListener('change', fillCities); el('f-city').addEventListener('change', showQuote);
  el('form').addEventListener('submit', async function (e) {
    e.preventDefault(); var go = el('f-go'); go.disabled = true;
    var r = await sb.rpc('create_shipment', { p_customer_name: el('f-name').value, p_customer_phone: el('f-phone').value, p_address: el('f-addr').value, p_cod: +el('f-cod').value || 0, p_area_id: el('f-city').value });
    go.disabled = false;
    if (r.error) { toast('err', /area_not_covered/.test(r.error.message) ? t('e_area') : /not_active/.test(r.error.message) ? t('e_inactive') : t('e_save')); return; }
    toast('ok', t('ok')); el('f-name').value = ''; el('f-phone').value = ''; el('f-addr').value = ''; el('f-cod').value = 0; await load();
  });
  el('filters').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { filter = b.getAttribute('data-f'); renderRows(); } });
  el('q').addEventListener('input', function (e) { query = e.target.value; renderRows(); });
  el('rows').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-track]'); if (!b) return;
    var s = ships.filter(function (x) { return x.id === b.getAttribute('data-track'); })[0]; if (!s) return;
    var r = await sb.from('shipment_events').select('status,created_at').eq('shipment_id', s.id).order('created_at', { ascending: true });
    var ev = r.data || [];
    var steps = [['new', 'box'], ['picked_up', 'box'], ['out_for_delivery', 'truck'], [s.status === 'returned' ? 'returned' : 'delivered', s.status === 'returned' ? 'rotate' : 'check']];
    var idx = -1; steps.forEach(function (x, i) { if (x[0] === s.status) idx = i; });
    el('m-code').textContent = s.code;
    el('m-body').innerHTML = '<ul class="tl">' + steps.map(function (x, i) { var w = ev.filter(function (y) { return y.status === x[0]; })[0]; var c = i < idx ? 'done' : i === idx ? 'now' : ''; return '<li class="' + c + '"><span class="d">' + ic(x[1]) + '</span><div>' + t('st_' + x[0]) + (w ? '<small>' + esc(dt(w.created_at, true)) + '</small>' : '') + '</div></li>'; }).join('') + '</ul>';
    el('modal').hidden = false;
  });
  el('m-close').addEventListener('click', function () { el('modal').hidden = true; });
  el('modal').addEventListener('click', function (e) { if (e.target === el('modal')) el('modal').hidden = true; });
  el('csv').addEventListener('click', function () {
    var rows = [['code', 'customer', 'phone', 'area', 'address', 'cod', 'fee', 'status', 'date']].concat(ships.map(function (s) { return [s.code, s.customer_name, s.customer_phone, s.zone || '', s.address, s.cod, s.fee, s.status, s.created_at]; }));
    var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { var v = String(c == null ? '' : c); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'bareed-shipments.csv'; document.body.appendChild(a); a.click(); a.remove();
  });
  el('lang').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('bareed.lang', lang); } catch (e) {} renderAll(); if (me && me.status !== 'active') banner(me.status === 'pending' ? 'wait' : 'bad', me.status === 'pending' ? 'pending' : me.status === 'none' ? 'nomerchant' : 'suspended'); });
  try { var th = localStorage.getItem('bareed.theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  function curTheme() { return document.documentElement.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function paintTheme() { el('theme').innerHTML = ic(curTheme() === 'dark' ? 'sun' : 'moon'); }
  el('theme').addEventListener('click', function () { var n = curTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('bareed.theme', n); } catch (e) {} paintTheme(); });
  el('logout').addEventListener('click', async function () { await sb.auth.signOut(); location.href = './'; });

  var SUPABASE_URL = 'https://ybkkdjpgkkdnijafsuai.supabase.co';
  // Public (anon) key: safe in the browser; row-level security limits each merchant to their own rows.
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlia2tkanBna2tkbmlqYWZzdWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODkyNDksImV4cCI6MjExMDA2NTI0OX0.PJ-leYQkSNyKaCs_hnFiYdgUVkpQYyLo8eFKvSL40gU';
  renderStatic();
  if (!window.supabase) { el('load').textContent = 'Supabase library not loaded'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  start();
})();
</script>
</body></html>
