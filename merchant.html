  try { var th = localStorage.getItem('bareed.theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  function paintTheme() { el('theme').innerHTML = ic(curTheme() === 'dark' ? 'sun' : 'moon'); }
