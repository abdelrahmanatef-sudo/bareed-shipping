/* nav + hero */
.hero { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--hero-b) 0%, var(--hero-a) 70%); color: var(--hero-ink); isolation: isolate; }

.hero h1 { font-size: clamp(34px, 5vw, 58px); font-weight: 700; margin-top: 18px; }

.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.track { margin-top: 30px; display: flex; gap: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(8px); border-radius: 16px; padding: 8px; max-width: 480px; }

.tl { list-style: none; margin: 14px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 6px 0; position: relative; color: var(--muted); }
.tl li::before { content: ""; position: absolute; inset-inline-start: 14px; top: 34px; bottom: -6px; width: 2px; background: var(--line); }

/* hero visual: the route */
.route-card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; padding: 26px; backdrop-filter: blur(10px); transform: perspective(1000px) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transition: transform .15s ease-out; }

.stop:last-child::before { display: none; }

@keyframes drive { 0% { transform: translateY(0); } 50% { transform: translateY(var(--travel, 220px)); } 100% { transform: translateY(0); } }

/* sections */
section { padding-block: 84px; }
.sec-h { max-width: 640px; margin-bottom: 40px; }
.sec-h .k { color: var(--brand); font-weight: 600; font-size: 14px; letter-spacing: .04em; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: -52px; position: relative; z-index: 3; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 38px; line-height: 1.2; font-variant-numeric: tabular-nums; background: linear-gradient(120deg, var(--brand), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; counter-reset: s; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px; position: relative; transition: transform .25s, box-shadow .25s; overflow: hidden; }

.step::after { counter-increment: s; content: counter(s); position: absolute; inset-block-start: 8px; inset-inline-end: 18px; font-family: var(--font-display); font-weight: 700; font-size: 72px; color: var(--brand-soft); line-height: 1; }
.step .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin-bottom: 16px; position: relative; z-index: 1; }
.step h3 { font-size: 19px; position: relative; z-index: 1; } .step p { color: var(--muted); margin-top: 8px; position: relative; z-index: 1; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.feat div { background: var(--surface-2); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.feat svg { color: var(--accent); width: 26px; height: 26px; } .feat b { font-family: var(--font-display); } .feat span { color: var(--muted); font-size: 15px; }

/* coverage */
.cov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px; box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 14px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: transform .15s, border-color .15s; }
.chip:hover { transform: translateY(-2px); border-color: var(--brand); }
.chip.on { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-color: transparent; font-weight: 600; }
.chip.open { border-color: var(--brand); }
.chip.open::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #38BDF8; }
.chip.soon { color: var(--muted); cursor: default; } .chip.soon:hover { transform: none; border-color: var(--line); }
.chip.city.open { background: var(--good-bg); color: var(--good); border-color: transparent; font-weight: 600; }
.sel { display: grid; gap: 12px; margin-top: 8px; }
.sel select, .field textarea { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; color: var(--ink); font: inherit; resize: vertical; }
  .field input, .field select { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 11px 14px; color: var(--ink); }
.sel select:focus, .field input:focus, .field select:focus { border-color: var(--brand); outline: none; }
.verdict { margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-weight: 500; }
.verdict.yes { background: var(--good-bg); color: var(--good); } .verdict.no { background: var(--warn-bg); color: var(--warn); }
.pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.price { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 10px; }
.price.hot { background: linear-gradient(160deg, var(--hero-b), var(--hero-a)); color: var(--hero-ink); border: 0; }
.price .n { font-family: var(--font-display); font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.price ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.price li { display: flex; gap: 10px; align-items: flex-start; } .price li svg { color: var(--brand-2); margin-top: 3px; }
.cta { background: linear-gradient(135deg, var(--hero-b), var(--hero-a)); color: var(--hero-ink); border-radius: 28px; padding: clamp(28px, 5vw, 56px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; position: relative; overflow: hidden; }
.cta h2 { font-size: clamp(24px, 3vw, 36px); max-width: 20ch; } .cta p { color: var(--hero-muted); margin-top: 8px; }
footer { padding-block: 36px 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(4,14,28,.62); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; overflow: auto; }
.dialog { width: min(440px, 100%); background: var(--surface); border-radius: 24px; padding: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.4); display: grid; gap: 16px; animation: pop .25s ease; }
@keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.field { display: grid; gap: 5px; } .field label { font-size: 13px; font-weight: 500; }
.msg { font-size: 14px; min-height: 20px; } .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
.x { justify-self: end; }

/* reveal */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s ease; transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }

@media (max-width: 900px) {
  .hero-grid, .cov { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .links { display: none; } .hero-grid { padding-block: 32px 80px; }
  .route-card { transform: none !important; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .rv { opacity: 1; transform: none; } }

/* soft (neumorphic) sign-in */
:root { --nm-bg: #E7ECF3; --nm-hi: #FFFFFF; --nm-lo: #C5CEDB; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --nm-bg: #122034; --nm-hi: #1B2D44; --nm-lo: #0A1424; } }
:root[data-theme="dark"] { --nm-bg: #122034; --nm-hi: #1B2D44; --nm-lo: #0A1424; }
.modal.nm { background: var(--nm-bg); backdrop-filter: none; overflow: auto; }
.nm-circle { position: absolute; border-radius: 50%; background: var(--nm-bg); box-shadow: 14px 14px 30px var(--nm-lo), -14px -14px 30px var(--nm-hi); pointer-events: none; animation: float 12s ease-in-out infinite; }
.nm-circle.c1 { width: 240px; height: 240px; top: 6%; inset-inline-start: 6%; }
.nm-circle.c2 { width: 110px; height: 110px; top: 22%; inset-inline-end: 22%; animation-delay: -4s; }
.nm-circle.c3 { width: 200px; height: 200px; bottom: 6%; inset-inline-end: 8%; animation-delay: -8s; }
.modal.nm .dialog { position: relative; background: var(--nm-bg); border-radius: 32px; padding: 36px 32px 28px; gap: 20px; width: min(420px, 100%); box-shadow: 16px 16px 36px var(--nm-lo), -16px -16px 36px var(--nm-hi); }
.nm-lock { width: 76px; height: 76px; margin: -62px auto 0; border-radius: 50%; display: grid; place-items: center; background: var(--nm-bg); color: var(--accent); box-shadow: 8px 8px 18px var(--nm-lo), -8px -8px 18px var(--nm-hi); }
.nm-lock svg { width: 30px; height: 30px; }
.modal.nm h2 { font-size: 28px; } .nm-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.modal.nm .field label { font-size: 12px; color: var(--muted); padding-inline: 6px; }
.modal.nm .field input { background: var(--nm-bg); border: 0; border-radius: 16px; padding: 14px 16px; box-shadow: inset 6px 6px 12px var(--nm-lo), inset -6px -6px 12px var(--nm-hi); }
.modal.nm .field input:focus { box-shadow: inset 6px 6px 12px var(--nm-lo), inset -6px -6px 12px var(--nm-hi), 0 0 0 2px var(--brand); }
.modal.nm .btn { background: var(--nm-bg); color: var(--brand); border-radius: 16px; padding: 14px; box-shadow: 8px 8px 18px var(--nm-lo), -8px -8px 18px var(--nm-hi); }
.modal.nm .btn:hover { transform: none; box-shadow: 5px 5px 12px var(--nm-lo), -5px -5px 12px var(--nm-hi); }
.modal.nm .btn:active { box-shadow: inset 5px 5px 10px var(--nm-lo), inset -5px -5px 10px var(--nm-hi); }
.nm-check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }
.nm-check input { appearance: none; width: 22px; height: 22px; border-radius: 7px; background: var(--nm-bg); box-shadow: inset 3px 3px 6px var(--nm-lo), inset -3px -3px 6px var(--nm-hi); display: grid; place-items: center; cursor: pointer; margin: 0; }
.nm-check input:checked::after { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }

  setInterval(function () { if (document.visibilityState === 'visible' && el('tr-out').querySelector('[data-poll]') && sb) el('track-form').dispatchEvent(new Event('submit', { cancelable: true })); }, 30000);

  /* ---------- auth ---------- */
  function renderAuthTexts() {
    el('dlg-t').textContent = t(mode === 'login' ? 't_login' : 't_signup');
    el('dlg-s').textContent = t(mode === 'login' ? 's_login' : 's_signup');
    el('a-submit').textContent = t(mode === 'login' ? 'go_login' : 'go_signup');
    el('sw-t').textContent = t(mode === 'login' ? 'sw_to_signup' : 'sw_to_login');
    document.querySelectorAll('[data-su]').forEach(function (n) { n.hidden = mode === 'login'; });
    document.querySelectorAll('[data-li]').forEach(function (n) { n.hidden = mode !== 'login'; });
    el('a-pass').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
  }
  function setMode(m) { mode = m; el('a-msg').textContent = ''; renderAuthTexts(); }
  function openModal(m) { if (signedIn && m === 'login') { go(); return; } setMode(m); try { var re = localStorage.getItem('bareed.email'); if (re) { el('a-email').value = re; el('a-remember').checked = true; } } catch (e) {} el('modal').hidden = false; setTimeout(function () { el(m === 'signup' ? 'a-name' : 'a-email').focus(); }, 30); }
  function closeModal() { el('modal').hidden = true; }
  function msg(k, ok) { var m = el('a-msg'); m.textContent = k ? t(k) : ''; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
  async function go() {
    var a = await sb.from('admins').select('user_id').maybeSingle();
    location.href = (a.data ? 'admin' : 'merchant');
  }
  el('login-btn').addEventListener('click', function () { openModal('login'); });
  el('signup-btn').addEventListener('click', function () { openModal('signup'); });
  el('signup-btn2').addEventListener('click', function () { openModal('signup'); });
  el('m-close').addEventListener('click', closeModal);
  el('modal').addEventListener('click', function (e) { if (e.target === el('modal')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  el('sw-b').addEventListener('click', function () { setMode(mode === 'login' ? 'signup' : 'login'); });
  el('auth-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!sb) { msg('no_lib'); return; }
    var email = el('a-email').value.trim(), pass = el('a-pass').value;
    try {
      if (mode === 'login') {
        var r = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (r.error) { msg('e_login'); return; }
        try { if (el('a-remember').checked) localStorage.setItem('bareed.email', email); else localStorage.removeItem('bareed.email'); } catch (e) {}
        await go();
      } else {
        var name = el('a-name').value.trim(), phone = el('a-phone').value.trim(), address = el('a-addr').value.trim();
        if (!name || !phone) { msg('e_name'); return; }
        if (!/^01[0125][0-9]{8}$/.test(phone)) { msg('e_ph11'); return; }
        var s = await sb.auth.signUp({ email: email, password: pass, options: { data: { name: name, phone: phone, address: address } } });
        if (s.error) { msg('e_fail'); return; }
        if (s.data && s.data.session) { location.href = 'merchant'; } else { msg('ok_signup', true); }
      }
    } catch (err) { msg('e_fail'); }
  });

  /* ---------- individual orders ---------- */
  (function () {
    var form = el('o-form'), amsg = el('o-msg');
    var OMP = null, mtg = el('o-map-tg'); mtg.textContent = '📍 ' + (lang === 'ar' ? 'حدد نقطة البداية والنهاية على الخريطة' : 'Set start and end points on the map');
    mtg.addEventListener('click', function () { var b = el('o-mapbox'); b.hidden = !b.hidden; if (!b.hidden && !OMP && window.BareedMap) OMP = BareedMap.picker(b, {}); });
    function open() { el('o-done').hidden = true; form.hidden = false; amsg.textContent = ''; el('omodal').hidden = false; }
    el('send-btn').addEventListener('click', open);
    el('o-close').addEventListener('click', function () { el('omodal').hidden = true; });
    el('omodal').addEventListener('click', function (e) { if (e.target === el('omodal')) el('omodal').hidden = true; });
        form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (el('o-hp').value) return;
      if (!sb) { amsg.className = 'msg err'; amsg.textContent = t('no_lib'); return; }
      var btn = el('o-submit'); btn.disabled = true; amsg.textContent = '';
      var ntk = null; try { ntk = localStorage.getItem('bareed-chat-token'); if (!ntk) { ntk = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var q = Math.random() * 16 | 0; return (c === 'x' ? q : (q & 3 | 8)).toString(16); }); localStorage.setItem('bareed-chat-token', ntk); } localStorage.setItem('bareed-notify-offer', '1'); } catch (e) {}
      var opt = OMP && OMP.get(); sb.rpc('submit_public_order_v2', { p_name: el('o-sn').value, p_phone: el('o-sp').value, p_address: el('o-pa').value, p_notes: el('o-nt').value, p_token: ntk, p_pickup_lat: opt ? opt.a.lat : null, p_pickup_lng: opt ? opt.a.lng : null, p_drop_lat: opt ? opt.b.lat : null, p_drop_lng: opt ? opt.b.lng : null, p_km: opt ? opt.km : null }).then(function (r) {
        btn.disabled = false;
        if (r.error) { amsg.className = 'msg err'; amsg.textContent = /rate_limited/.test(r.error.message) ? t('o_rate') : /invalid_input|area_not/.test(r.error.message) ? t('o_err') : t('o_fail'); return; }
        var c = r.data && r.data.code; form.hidden = true; form.reset();
        var d = el('o-done'); d.hidden = false;
        d.innerHTML = '<h2>' + esc(t('o_ok')) + '</h2><p style="font-family:var(--font-display);font-size:28px;color:var(--brand)" dir="ltr">' + esc(c) + '</p><p class="nm-sub">' + esc(t('o_ok2')) + '</p><button class="btn" type="button" id="o-tr">' + esc(t('o_track')) + '</button>';
        el('o-tr').onclick = function () { el('omodal').hidden = true; el('tr-in').value = c; el('track-form').dispatchEvent(new Event('submit', { cancelable: true })); el('track-form').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      }).catch(function () { btn.disabled = false; amsg.className = 'msg err'; amsg.textContent = t('o_fail'); });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') el('omodal').hidden = true; });
  })();

  /* ---------- install app buttons ---------- */
  (function () {
    var dp = null, box = el('app-steps');
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; });
    window.addEventListener('appinstalled', function () { box.hidden = false; box.textContent = t('app_done'); });
    function show(k) { box.hidden = false; box.textContent = t(k); }
    el('app-and').addEventListener('click', function () {
      if (dp) { dp.prompt(); dp.userChoice.finally(function () { dp = null; }); } else show('app_and_s');
    });
    el('app-ios').addEventListener('click', function () {
      // iOS cannot install a web app silently: open the share sheet, where "Add to Home Screen" is one tap away
      if (navigator.share) {
        show('app_ios_h');
        navigator.share({ title: t('brand'), url: location.origin + '/app' }).catch(function (e) { if (!e || e.name !== 'AbortError') show('app_ios_s'); });
      } else show('app_ios_s');
    });
  })();

  /* ---------- boot ---------- */
  renderAll(); observe();
  var SUPABASE_URL = 'https://ybkkdjpgkkdnijafsuai.supabase.co';
  // Public (anon) key: safe in the browser; row-level security limits what it can read.
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlia2tkanBna2tkbmlqYWZzdWFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODkyNDksImV4cCI6MjExMDA2NTI0OX0.PJ-leYQkSNyKaCs_hnFiYdgUVkpQYyLo8eFKvSL40gU';
  if (window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.from('areas').select('id,gov_ar,gov_en,city_ar,city_en,is_active').then(function (r) { if (!r.error && r.data) { areas = r.data; renderAll(); } });
    sb.auth.getSession().then(function (r) { if (r.data && r.data.session) { signedIn = true; el('login-btn').textContent = t('dash'); } });
  }

})();
</script>
